<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Acompanhe onde você parou em cada livro, mangá, manhwa e manhua da sua estante.">
  <meta name="theme-color" content="#14100B">

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Onde Parei?">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Onde Parei?</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #14100B;
    }

    /* Splash exibido até o primeiro frame do Flutter, evitando o flash branco. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #14100B;
      color: #D3AC63;
      font-family: Georgia, "Times New Roman", serif;
      z-index: 9999;
      transition: opacity 260ms ease-out;
    }

    #loading.hidden { opacity: 0; pointer-events: none; }

    #loading .mark {
      width: 74px;
      height: 74px;
      border-radius: 20px;
      border: 1px solid rgba(211, 172, 99, 0.34);
      background: rgba(211, 172, 99, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    #loading .title { font-size: 26px; letter-spacing: 0.3px; }

    #loading .bar {
      width: 128px;
      height: 3px;
      border-radius: 999px;
      background: rgba(211, 172, 99, 0.18);
      overflow: hidden;
    }

    #loading .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #D3AC63;
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }

    @media (prefers-color-scheme: light) {
      html, body, #loading { background: #FBF5E7; }
      #loading { color: #8A5A26; }
      #loading .mark {
        border-color: rgba(138, 90, 38, 0.3);
        background: rgba(138, 90, 38, 0.1);
      }
      #loading .bar { background: rgba(138, 90, 38, 0.18); }
      #loading .bar::after { background: #8A5A26; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="mark">📖</div>
    <div class="title">Onde Parei?</div>
    <div class="bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
